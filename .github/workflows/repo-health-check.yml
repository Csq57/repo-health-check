name: Repository health tool tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      # Resolved against official upstream v4 tag on 2026-10-21.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Resolved against official upstream v5 tag on 2026-10-21.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_repo_health_check.py' -v
      - name: Show inventory (not a quality gate)
        run: python tools/repo_health_check.py . --format text
      - name: Smoke-test composite Action against this checkout
        uses: ./
        with:
          path: .
          format: json
          fail-on: warning
          redact-root: 'true'
